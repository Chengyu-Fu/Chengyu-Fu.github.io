  portrait_caption: 付承宇
  short_bio: >-
    <p>你好，我是付承宇。2025 年，我获哈尔滨理工大学工学学士学位，目前在该校攻读材料科学与工程硕士学位。</p>
    <p>我主要研究如何将机器学习与物理机理相结合，用于材料成形过程的建模与预测。此前的工作涉及管材弯曲回弹预测与补偿、流动应力预测，以及机器学习辅助的高熵合金设计。欢迎交流与合作。</p>

